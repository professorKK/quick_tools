[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quicktools"
version = "0.1.0"
description = "A small cross-platform plugin launcher with a calculator, clipboard history and screenshot tools"
requires-python = ">=3.10"
dependencies = [
  "pynput>=1.7.7,<2",
  "pystray>=0.19.5,<1",
  "Pillow>=9.0,<12",
  "python-xlib>=0.33; sys_platform == 'linux'",
  "jeepney>=0.8,<1; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
quicktools = "quicktools.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quicktools*"]

[tool.setuptools.package-data]
quicktools = ["plugins/*/plugin.json", "assets/*", "assets/keypad/*", "assets/fonts/*", "helpers/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
